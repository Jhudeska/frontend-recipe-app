<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Receta logo</title>
<desc>A flat circular logo featuring a bowl with steam rising and a crossed fork and spoon in olive green, with the word Receta in cream lettered inside the circle below the bowl.</desc>
<style>
.bg{fill:#606C38}
.bowl{fill:#FFF7EC}
.bowlEdge{fill:#F2E4CF}
.utensil{fill:#606C38}
.steam{stroke:#FFF7EC;stroke-width:8;stroke-linecap:round;fill:none;opacity:0.85}
.wordmark{fill:#FFF7EC;font-family:Georgia, 'Times New Roman', serif;font-size:52px;text-anchor:middle}
</style>

<circle cx="340" cy="340" r="300" class="bg"/>

<path class="steam" d="M280 165 C 265 195, 300 210, 285 240" />
<path class="steam" d="M340 150 C 325 185, 360 200, 345 235" />
<path class="steam" d="M400 165 C 385 195, 420 210, 405 240" />

<path class="bowlEdge" d="M180 315 a160 60 0 0 0 320 0 z" />
<path class="bowl" d="M195 320 a145 45 0 0 0 290 0 C 485 435, 195 435, 195 320 Z" />
<path class="bowlEdge" d="M195 320 C 195 435, 485 435, 485 320 L 470 320 C 470 420, 210 420, 210 320 Z" />

<g transform="translate(500,275)">
<rect x="-8" y="-90" width="16" height="180" rx="8" class="utensil"/>
<ellipse cx="0" cy="-95" rx="18" ry="26" class="utensil"/>
</g>

<g transform="translate(180,275) rotate(0)">
<rect x="-6" y="-20" width="12" height="180" rx="6" class="utensil"/>
<rect x="-22" y="-95" width="8" height="80" rx="4" class="utensil"/>
<rect x="-6" y="-95" width="8" height="80" rx="4" class="utensil"/>
<rect x="10" y="-95" width="8" height="80" rx="4" class="utensil"/>
<path d="M-24 -20 Q -24 -60, 0 -60 Q 24 -60, 24 -20 Z" class="utensil"/>
</g>

<text x="340" y="565" class="wordmark">Receta</text>
</svg>
